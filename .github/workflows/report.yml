name: Work report (Slack)

# 공개 레포 주의: 보고서 원문은 커밋·로그에 남기지 않고 슬랙으로만 보낸다.
# 이미 보고한 커밋 기록(report/.state)은 Actions 캐시로만 보존한다.
on:
  # 예약 실행 일시 중지 (2026-10-06): GitHub 예약이 2~8시간씩 늦게 시작해 일간 보고로 쓸 수 없어 당분간 수동 실행만 한다.
  # 다시 켜려면 아래 주석을 풀거나, 외부 스케줄러(Cloud Scheduler 등)로 workflow_dispatch를 호출한다.
  # schedule:
  #   # 시각을 바꾸면 report.mjs DAILY_AT/WEEKLY_AT도 같이 바꾼다.
  #   - cron: '50 8 * * 1-5'  # 일간: 평일 17:50 KST
  #   - cron: '50 23 * * 0-4' # 주간: 평일 08:50 KST (UTC 일~목 23:50) — 그 주 마지막 근무일에만 게시 (보통 금, 금 휴무면 목)
  workflow_dispatch:
    inputs:
      mode:
        description: daily | weekly
        type: choice
        options: [daily, weekly]
        default: daily
      date:
        description: 기준 날짜 YYYY-MM-DD (비우면 오늘 KST)
        required: false
      post:
        description: 슬랙에 게시 (끄면 집계 건수만 확인)
        type: boolean
        default: true
      preview:
        description: 미리보기 — 게시하지 않고 본문을 암호화 아티팩트로 남김 (로컬 개인키로만 열림)
        type: boolean
        default: false
      include_reported:
        description: (미리보기 전용) 이미 보고한 커밋도 포함 — 규칙 변경 확인용, 게시 불가
        type: boolean
        default: false
      preview_run:
        description: 이 미리보기 실행 ID의 본문을 그대로 게시 (다시 만들지 않음)
        required: false

permissions:
  contents: read

concurrency:
  group: work-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Resolve mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_POST: ${{ github.event.inputs.post }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_PREVIEW: ${{ github.event.inputs.preview }}
          IN_PREVIEW_RUN: ${{ github.event.inputs.preview_run }}
          IN_INCLUDE_REPORTED: ${{ github.event.inputs.include_reported }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "50 23 * * 0-4" ]; then echo "mode=weekly" >> "$GITHUB_OUTPUT"; else echo "mode=daily" >> "$GITHUB_OUTPUT"; fi
            echo "post=true" >> "$GITHUB_OUTPUT"
            echo "skip_holiday=true" >> "$GITHUB_OUTPUT"
          else
            echo "mode=$IN_MODE" >> "$GITHUB_OUTPUT"
            echo "post=$IN_POST" >> "$GITHUB_OUTPUT"
            echo "preview=$IN_PREVIEW" >> "$GITHUB_OUTPUT"
            echo "include_reported=$IN_INCLUDE_REPORTED" >> "$GITHUB_OUTPUT"
            if [ -n "$IN_PREVIEW_RUN" ]; then
              [[ "$IN_PREVIEW_RUN" =~ ^[0-9]+$ ]] || { echo "preview_run 형식 오류"; exit 1; }
              echo "preview_run=$IN_PREVIEW_RUN" >> "$GITHUB_OUTPUT"
            fi
            if [ -n "$IN_DATE" ]; then
              [[ "$IN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "date 형식 오류"; exit 1; }
              echo "date=$IN_DATE" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Clone target repos (최근 21일, 전체 브랜치)
        if: steps.mode.outputs.preview_run == ''
        env:
          TOKEN_ALL: ${{ secrets.REPOS_TOKEN }}
          TOKEN_ND:  ${{ secrets.REPOS_TOKEN_ND }}
          TOKEN_FO:  ${{ secrets.REPOS_TOKEN_FO }}
        run: |
          mkdir -p _repos
          since=$(date -u -d '21 days ago' +%Y-%m-%d)
          # harvest.js REPOS + nd-market 조직의 보관되지 않은 나머지 레포(새 레포 자동 포함). 추가분 이름은 _repos/.extra.json 으로 넘긴다.
          GH_TOKEN="${TOKEN_ND:-$TOKEN_ALL}" gh repo list nd-market --no-archived -L 1000 --json name -q '.[].name' > /tmp/org-repos.txt
          node -e "
            const fs = require('fs');
            const known = require('./harvest').repoList();
            const knownNames = new Set(known.map(r => r.slug.split('/')[1]));
            const extra = fs.readFileSync('/tmp/org-repos.txt', 'utf8').split('\n').filter(n => n && !knownNames.has(n));
            fs.writeFileSync('_repos/.extra.json', JSON.stringify(extra));
            for (const r of known) console.log(r.key + ' ' + r.slug);
            for (const n of extra) console.log(n + ' nd-market/' + n);
          " > /tmp/clone-list.txt
          echo "대상 레포 $(wc -l < /tmp/clone-list.txt)개 (조직 자동 추가 $(node -e "console.log(require('./_repos/.extra.json').length)")개)"
          while read key slug; do
            case "$slug" in
              fashionon-repo/*) TOKEN="${TOKEN_FO:-$TOKEN_ALL}" ;;
              *)                TOKEN="${TOKEN_ND:-$TOKEN_ALL}" ;;
            esac
            url="https://x-access-token:${TOKEN}@github.com/${slug}.git"
            git clone --quiet --no-tags --no-single-branch --shallow-since="$since" "$url" "_repos/$key" 2>/dev/null \
              || git clone --quiet --no-tags --no-single-branch --depth 200 "$url" "_repos/$key" 2>/dev/null \
              || echo "  ! skip $slug (권한/미존재)"
          done < /tmp/clone-list.txt

      - name: Restore reported-commit state
        uses: actions/cache/restore@v4
        with:
          path: report/.state
          key: work-report-state-${{ github.run_id }}
          restore-keys: work-report-state-

      - name: Restore previewed report
        if: steps.mode.outputs.preview_run != ''
        uses: actions/cache/restore@v4
        with:
          path: report/.pending
          key: work-report-pending-${{ steps.mode.outputs.preview_run }}
          fail-on-cache-miss: true

      - name: Post previewed report
        if: steps.mode.outputs.preview_run != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL_DAILY: ${{ secrets.SLACK_WEBHOOK_URL_DAILY }}
          SLACK_WEBHOOK_URL_WEEKLY: ${{ secrets.SLACK_WEBHOOK_URL_WEEKLY }}
        run: node report/report.mjs --post-pending

      - name: Build & post report
        if: steps.mode.outputs.preview_run == ''
        env:
          REPO_BASE: _repos
          AUTHOR_MAP_JSON: ${{ secrets.AUTHOR_MAP_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL_DAILY: ${{ secrets.SLACK_WEBHOOK_URL_DAILY }}
          SLACK_WEBHOOK_URL_WEEKLY: ${{ secrets.SLACK_WEBHOOK_URL_WEEKLY }}
        run: |
          args="--mode ${{ steps.mode.outputs.mode }}"
          [ -n "${{ steps.mode.outputs.date }}" ] && args="$args --date ${{ steps.mode.outputs.date }}"
          if [ "${{ steps.mode.outputs.preview }}" = "true" ]; then args="$args --preview"
            [ "${{ steps.mode.outputs.include_reported }}" = "true" ] && args="$args --include-reported"
          elif [ "${{ steps.mode.outputs.post }}" = "true" ]; then args="$args --post"; fi
          [ "${{ steps.mode.outputs.skip_holiday }}" = "true" ] && args="$args --skip-holiday"
          node report/report.mjs $args

      # 미리보기: 본문은 로컬 개인키로만 열리는 암호문 아티팩트, 게시 대기분은 외부에서 못 받는 Actions 캐시
      - name: Upload encrypted preview
        if: steps.mode.outputs.preview == 'true' && steps.mode.outputs.preview_run == ''
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: report/out/preview.enc.json
          retention-days: 3

      - name: Save pending report
        if: steps.mode.outputs.preview == 'true' && steps.mode.outputs.preview_run == ''
        uses: actions/cache/save@v4
        with:
          path: report/.pending
          key: work-report-pending-${{ github.run_id }}

      - name: Save reported-commit state
        if: steps.mode.outputs.post == 'true' && (steps.mode.outputs.preview != 'true' || steps.mode.outputs.preview_run != '')
        uses: actions/cache/save@v4
        with:
          path: report/.state
          key: work-report-state-${{ github.run_id }}
